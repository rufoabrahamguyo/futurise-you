# Local development stack. `docker compose up` works from a clean clone:
# values come from .env.example, overridden by .env when present.

name: applyvault

x-env: &env
  env_file:
    - path: .env.example
    - path: .env
      required: false

x-backend: &backend
  <<: *env
  build: ./backend
  image: applyvault-backend:dev
  volumes:
    - ./backend:/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_started
    mailpit:
      condition: service_started

services:
  postgres:
    <<: *env
    image: postgres:18-alpine
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-applyvault}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-applyvault-dev-secret}
      # PDF.js fetches presigned URLs directly from the browser.
      MINIO_API_CORS_ALLOW_ORIGIN: ${FRONTEND_URL:-http://localhost:5173}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  mailpit:
    image: axllent/mailpit:v1.33
    ports:
      - "8025:8025"
      - "1025:1025"

  backend:
    <<: *backend
    environment:
      RUN_MIGRATIONS: "1"
    # No host port: the frontend dev server proxies /api to the backend.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      backend:
        condition: service_healthy

  beat:
    <<: *backend
    command:
      ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: applyvault-frontend:dev
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
  frontend-node-modules:
