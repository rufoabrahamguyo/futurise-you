# Production-style stack. Object storage (S3 or compatible) and SMTP are external.
# Put TLS in front (load balancer or reverse proxy) and forward X-Forwarded-Proto.
#   cp .env.production.example .env.production   # fill in real values
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

name: applyvault-prod

x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile.prod
  image: applyvault-backend:prod
  env_file: .env.production
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:18-alpine
    env_file: .env.production
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 30

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 30

  backend:
    <<: *backend
    environment:
      RUN_MIGRATIONS: "1"
      SEED_DEMO: "0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      retries: 30
      start_period: 20s

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=4"]

  beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: applyvault-frontend:prod
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      STORAGE_ORIGIN: ${STORAGE_ORIGIN:?Set STORAGE_ORIGIN to the public origin of your S3 endpoint}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
